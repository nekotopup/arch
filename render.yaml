services:
  - type: web
    name: arch-topup
    runtime: docker
    plan: free
    
    # Build configuration
    buildCommand: |
      docker build -t arch-topup-app .
    
    # Environment variables
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: CACHE_DRIVER
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromService:
          name: arch-topup-db
          type: pgsql
          property: host
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        fromService:
          name: arch-topup-db
          type: pgsql
          property: database
      - key: DB_USERNAME
        fromService:
          name: arch-topup-db
          type: pgsql
          property: user
      - key: DB_PASSWORD
        fromService:
          name: arch-topup-db
          type: pgsql
          property: password
      - key: APP_URL
        fromService:
          type: web
          property: url
    
    # Environment secrets (set in Render dashboard)
    envVarsFrom:
      - APP_KEY
  
  - type: pgsql
    name: arch-topup-db
    plan: free
    dbName: arch_topup
    user: postgres
    
